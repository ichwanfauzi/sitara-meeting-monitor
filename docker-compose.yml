services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitara_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sitara_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sitara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitara_app} -d ${POSTGRES_DB:-sitara_dev}"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - api-db
      - scanner-db

  api:
    image: sitara-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL_CONTAINER:-postgresql+psycopg://sitara_app:change_me_local_only@postgres:5432/sitara_dev}"
      ACTION_ITEM_EVIDENCE_STORAGE_PATH: /var/lib/sitara/evidence
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOGIN_RATE_LIMIT_HMAC_KEY: "${LOGIN_RATE_LIMIT_HMAC_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SITARA_API_PORT:-8000}:8000"
    volumes:
      - type: volume
        source: sitara_action_item_evidence
        target: /var/lib/sitara/evidence
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - api-db

  clamav:
    image: sitara-clamav:1.5.4-ubuntu24.04
    build:
      context: ./backend
      dockerfile: Dockerfile.clamav
      args:
        CLAMAV_PORT: "${CLAMAV_PORT-3310}"
    user: clamav
    environment:
      CLAMAV_PORT: "${CLAMAV_PORT-3310}"
    restart: unless-stopped
    expose:
      - "${CLAMAV_PORT-3310}"
    volumes:
      - sitara_clamav_database:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamav-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    security_opt:
      - no-new-privileges:true
    networks:
      - scanner
      - clamav-egress

  evidence-scanner:
    image: sitara-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.evidence_scanner_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL_CONTAINER:-postgresql+psycopg://sitara_app:change_me_local_only@postgres:5432/sitara_dev}"
      ACTION_ITEM_EVIDENCE_STORAGE_PATH: /var/lib/sitara/evidence
      CLAMAV_HOST: clamav
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
      EVIDENCE_SCAN_POLL_SECONDS: ${EVIDENCE_SCAN_POLL_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - type: volume
        source: sitara_action_item_evidence
        target: /var/lib/sitara/evidence
        read_only: true
    deploy:
      replicas: 1
    security_opt:
      - no-new-privileges:true
    networks:
      - scanner-db
      - scanner

volumes:
  sitara_postgres_data:
  sitara_action_item_evidence:
  sitara_clamav_database:

networks:
  api-db:
    internal: true
  scanner-db:
    internal: true
  scanner:
    internal: true
  clamav-egress:
    driver: bridge
